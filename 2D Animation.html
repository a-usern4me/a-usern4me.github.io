<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset="UTF-8">

    <title>Jake McMillan | Character Design & 2D Animation</title>
    <link rel="icon" type="image/x-icon" href="Icons/Favicon.png">

<body class="container">
    <header>
        <h3>Character Design & 2D Animation</h3>

            <div class="imagePanels">

                <div class="blockFormatting">
                    <img src="Images/OC V2.webp" width="100%" height="100%" alt="Anka">

                    <video  width="324px" height="576px" controls preload="none" poster="Images/Keyframe 5.png">

        <p>©2026 Jake McMillan @jakemcmillansr388@gmail.com</p>
