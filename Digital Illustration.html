<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content= "width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio Website">

    <title>Jake McMillan | Digital Illustration</title>
    <link rel="icon" type="image/x-icon" href="Icons/Favicon.png">

    <link rel="stylesheet" type="text/css" href="styles.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>

<body class="container">
    <header>
        <h3>Digital Illustration</h3>
        <h4>Clip Studio Paint - August 2026</h4>
    </header>

    <main>
        <div class="contentBox">
            <div class="bioContainer">
                <p class="bioText">Inspired by comic books and manga, utilising bold colours and cel shading. Continuously working on improving
                    anatomy and more dynamic poses, with a focus on characters and detailed backgrounds. 
                </p>
            </div>
            <div class="imagePanels">
                <div class="imageFormatting0">
                    <img src="Images/Aigis.webp" width="100%" height="100%" alt="Aigis" fetchpriority="high">
                </div>

                <div class="imageFormatting0">
                    <img src="Images/Dimitri.webp" width="100%" height="100%" alt="Three Houses - Dimitri" fetchpriority="high">
                </div>
            </div>
        </div>

        <div class="contentBox">
            <a class="portfolioButton" onclick="history.back()" aria-label="Previous"><iconify-icon icon="ic:round-arrow-back"></iconify-icon></a>
        </div>
    </main>

    <footer>
        <p>©2026 Jake McMillan @jakemcmillansr388@gmail.com</p>
    </footer>

</body>

</html>
